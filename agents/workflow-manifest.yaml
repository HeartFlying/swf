# ============================================================
# 轻量化模式定义
# ============================================================

lightweight_mode:
  threshold: 90  # 信息完整度 ≥ 90 分触发
  skip_stages: [s1]  # 跳过整个 S1 阶段
  skip_skills: [S203, S406]  # 额外跳过 S203（隐性需求挖掘）、S406（原型设计）
  description: 轻量化模式跳过 5 个 Skill，执行 21 个 Skill

