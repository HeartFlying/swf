# SWF Workflow Manifest
# 单一事实源：定义所有阶段、Skill、依赖关系和阶段交接

version: 1
last_updated: 2026-04-14

# ============================================================
# 阶段定义
# ============================================================

stages:
  - id: s0
    name: Plan 制定
    name_en: Plan Definition
    coordinator: agents/coordinator-requirements.md
    description: 生成 Plan ID，评估信息完整度，创建执行计划

  - id: s1
    name: 市场洞察
    name_en: Market Insight
    coordinator: agents/coordinator-requirements.md
    description: 竞品分析和市场痛点验证
    lightweight_skip: true  # 轻量化模式下整个阶段跳过

  - id: s2
    name: 需求定义
    name_en: Requirements Definition
    coordinator: agents/coordinator-requirements.md
    description: 需求边界界定、显性/隐性需求提取、需求验证

  - id: s3
    name: 技术规划
    name_en: Technical Planning
    coordinator: agents/coordinator-requirements.md
    description: 技术可行性、技术选型、非功能需求、风险识别

  - id: s4
    name: 需求整合
    name_en: Requirements Integration
    coordinator: agents/coordinator-requirements.md
    description: 需求分类、优先级排序、核心需求提炼、用户故事、原型设计

  - id: s5
    name: 架构设计
    name_en: Architecture Design
    coordinator: agents/coordinator-architecture.md
    description: 架构愿景、视图设计、数据架构、接口架构、部署架构、架构验证

  - id: s6
    name: 详细设计
    name_en: Detailed Design
    coordinator: agents/coordinator-detailed-design.md
    description: 模块设计、数据库设计、UI/UX设计、测试策略

  - id: cm
    name: 变更管理
    name_en: Change Management
    coordinator: null  # 按需执行，无固定 coordinator
    description: 变更影响分析，生成最小重执行路径

# ============================================================
# Skill 定义
# ============================================================

